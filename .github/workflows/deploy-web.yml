# Publica a versão web (PWA) no GitHub Pages a cada push na main.
# Configuração única no GitHub: Settings → Pages → Source: "GitHub Actions".
name: Deploy PWA no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite rodar manualmente pela aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

# só um deploy por vez; um push novo cancela o anterior que ainda estiver rodando
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # erro de tipo no TypeScript para a publicação antes de gerar o app
      - name: Checar tipos
        run: npx tsc --noEmit

      # o site fica em https://<usuario>.github.io/<repositorio>/
      - name: Build web + service worker
        run: npm run build:web
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
